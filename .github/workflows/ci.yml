name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: fmt
        run: cargo fmt --all -- --check

      # tauri-build 校验 bundle resources 必须存在：干净 checkout 无 exe（构建产物）
      # 与模型（本地打包脚本拷贝），先放占位再编译，避免 workspace 构建假红
      - name: Prepare bundle resource placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crates/engram-gui/resources | Out-Null
          New-Item -ItemType File -Force crates/engram-gui/resources/engram-mcp.exe | Out-Null
          New-Item -ItemType Directory -Force crates/engram-gui/resources/models | Out-Null

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  frontend:
    name: Frontend (svelte-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: build
        run: npm run build

  golden:
    name: MCP golden contract
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      # 完整 diff 契约测试（已实装）：crates/engram-mcp/tests/golden_contract.rs
      # 拉起真实 engram-mcp 进程重放 11 条工具调用，归一化（时间戳/临时路径）后与
      # docs/test-golden/engram-mcp-golden.json 逐条对比；golden 缺失时 include_str! 编译失败。
      - name: golden contract
        run: cargo test -p engram-mcp --test golden_contract

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
          arguments: --hide-inclusion-graph
