name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  frontend:
    name: Frontend (svelte-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: build
        run: npm run build

  golden:
    name: MCP golden contract
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      # 完整 diff 契约测试（待实现）：用参数化的 tools/_collect_golden.ps1（-Exe/-Out）
      # 在临时工作区生成当前响应，与 docs/test-golden/engram-mcp-golden.json 做结构化 diff。
      # 当前步骤仅做 smoke：校验 golden 文件存在，防止误删/漏提交。
      - name: golden (smoke placeholder)
        shell: pwsh
        run: |
          if (-not (Test-Path docs/test-golden/engram-mcp-golden.json)) { throw "golden file missing" }
          Write-Host "golden contract smoke: file present (full diff test lands with contract test impl)"
