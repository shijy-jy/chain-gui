name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (NSIS + engram-mcp)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - run: npm ci
      - run: npm run build

      - name: Build engram-mcp (release)
        run: cargo build --release -p engram-mcp

      - name: Stage engram-mcp into bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crates/engram-gui/resources | Out-Null
          Copy-Item target/release/engram-mcp.exe crates/engram-gui/resources/engram-mcp.exe
          # models 占位：模型本体（+92MB）不入库，CI 安装包不含模型，运行时回退
          # %LOCALAPPDATA%\Engram\models（本地发布脚本会拷入完整模型）
          New-Item -ItemType Directory -Force crates/engram-gui/resources/models | Out-Null

      - name: Verify version stamp (drift anchor)
        shell: pwsh
        run: |
          $line = & target/release/engram-mcp.exe --version
          Write-Host $line
          $short = $env:GITHUB_SHA.Substring(0, 7)
          if ($line -notmatch [regex]::Escape($short)) { throw "版本戳不含 git 短哈希 $short（构建漂移）" }

      - name: Build NSIS (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/engram-gui
          tagName: ${{ github.ref_name }}
          releaseName: 'Engram ${{ github.ref_name }}'
          releaseBody: |
            自动发布（cargo workspace：engram-core / engram-mcp / engram-gui）。
            未覆盖项声明：GUI 端到端（WebDriver 冒烟）尚未自动化；MCP 10 工具已由 golden 契约测试覆盖（CI golden job，12 条调用）；真实目录端到端验证为 ignored 测试，需手动执行 `cargo test -p engram-core --test real_dir_verify -- --ignored`；嵌入模型（+92MB）不入库，CI 安装包不含模型，运行时回退 %LOCALAPPDATA%\Engram\models。
          releaseDraft: true
          prerelease: false
