[package]
name = "engram-core"
version = "2.9.0"
description = "Engram 领域核心：唯一知道「规则」的纯库（零 Tauri、零 MCP 依赖）"
authors = ["shijy-jy"]
license = "MIT"
repository = "https://github.com/shijy-jy/engram"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
walkdir = "2"
# watcher 事件循环（纯回调构造，Tauri 发射留在 GUI 侧）
notify = "8.2.0"
# 本地嵌入（记忆层 L2 语义召回；精确锁防 rc 漂移，框架文档 T10）
fastembed = "=6.0.3"
# M-Code 代码骨架（框架 T12 拍板试点语言 Rust；tree-sitter 提取 pub 接口/调用边）
tree-sitter = "0.22"
tree-sitter-rust = "0.21"

[dev-dependencies]
tempfile = "3"
