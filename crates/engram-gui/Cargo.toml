[package]
name = "engram-gui"
version = "3.1.0"
description = "Engram — 开发者与 AI 共用的工程记忆图谱与知识库（本地优先、纯文本、桌面可视化）"
authors = ["shijy-jy"]
license = "MIT"
repository = "https://github.com/shijy-jy/engram"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "engram_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

# 显式声明 bin：engram-mcp 已拆分为独立 crate（engram-mcp），此处仅主程序。
# 2.7.0 打包事故（多 bin 导致 tauri build 主程序错选）从结构上消除：GUI crate 只有一个 bin。
[[bin]]
name = "app"
path = "src/main.rs"

# v3.1 修复「改了前端但 release 看不到」：
# tauri 的 build.rs 用 `let dev = !has_feature("custom-protocol")` 判定运行模式 ——
# 没有这个 feature 的 release 构建**仍然是 dev 模式**，运行时去请求 devUrl
# (http://localhost:1420) 而**不内嵌前端**，于是 frontendDist(dist/) 根本没用上。
# cargo tauri build 会自动加 --features custom-protocol，但直接 `cargo build --release`
# 不会 —— 这就是"前端重建了、二进制还是旧的"的根因（实测：vite 一停就 chrome-error）。
# 补上这段标准特性块后，两种构建方式行为一致。
[features]
# this feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
engram-core = { path = "../engram-core", version = "3.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
# WatchState 持有 RecommendedWatcher（core::watch 构造回调，GUI 持有句柄）
notify = "8.2.0"
# v1.8 证据打开：ShellExecuteW 直调（参照 tauri-plugin-opener/open crate 的 shellexecute 实现与 Python os.startfile；
# explorer.exe/cmd start 均有怪癖，不可靠）。windows-sys 0.59 已在依赖树中，无新增外部 crate。
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }
